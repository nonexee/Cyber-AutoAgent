[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-autoagent"
version = "0.2.0"
description = "Simple autonomous security assessment tool using Claude"
readme = "README.md"
authors = [
    {name = "Cyber-AutoAgent Team", email = "aaron.weston.brown@gmail.com"}
]
license = {text = "MIT"}
keywords = ["cybersecurity", "penetration-testing", "ai-agent", "claude", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Environment :: Console"
]
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.11.0",
    "strands-agents-tools>=0.2.9",
    "mem0ai>=0.1.0",
    "faiss-cpu>=1.7.4",
    "python-dotenv>=1.0.0",
]

[project.scripts]
cyber-autoagent = "cli:main"

[tool.setuptools]
packages = ["src", "src.modules"]
